<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carava Mobile Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; padding: 0; background: #15191b; color: #f1f4f2; font-family: sans-serif; }
    .frame-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    iframe { width: 390px; height: 844px; max-width: 100%; max-height: 100vh; border: 1px solid rgba(255,255,255,.14); border-radius: 22px; background: #202528; box-shadow: 0 22px 60px rgba(0,0,0,.45); }
    @media (max-width: 430px) { iframe { width: 100%; height: 100vh; border: 0; border-radius: 0; } }
  </style>
</head>
<body>
  <script>
    localStorage.setItem("carava-demo-locale", "en")
    localStorage.setItem("carava-demo-signed-in", "true")
    localStorage.setItem("carava-demo-account-type", "customer")
  </script>
  <div class="frame-wrap"><iframe src="/" title="Carava mobile preview"></iframe></div>
</body>
</html>
